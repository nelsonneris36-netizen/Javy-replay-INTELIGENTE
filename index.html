<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javy Replay</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            text-align: center;
            padding: 20px 10px 10px 10px;
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
        }
        h1 span {
            color: #FFD700;
        }
        p {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
        }
        .counter-badge {
            display: inline-block;
            margin: 10px auto;
            padding: 6px 16px;
            border: 1px solid #FFD700;
            border-radius: 20px;
            font-size: 13px;
            color: #FFD700;
        }
        .chat-container {
            flex: 1;
            margin: 10px 16px;
            background: #161616;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #222;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.bot {
            background: #222222;
            color: #dddddd;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: #FFD700;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }
        .chat-input-area {
            padding: 12px;
            background: #111111;
            display: flex;
            gap: 8px;
            border-top: 1px solid #222;
        }
        .chat-input-area input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus {
            border-color: #FFD700;
        }
        .chat-input-area button {
            background: #FFD700;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background: #111111;
            padding: 12px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            text-align: center;
            color: #777;
            font-size: 11px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #FFD700;
        }
    </style>
</head>
<body>

    <header>
        <h1>Javy <span>Replay</span></h1>
        <p>Suas histórias. Suas lembranças com IA.</p>
        <div class="counter-badge">0 Lembranças Guardadas</div>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">🤖 Salve meu chefe! Javy na área. Me pergunte sobre alguma lembrança que você guardou!</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Javy, lembra de..." />
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item">📄<br>Nova</a>
        <a href="#" class="nav-item">🔍<br>Histórico</a>
        <a href="#" class="nav-item active">🤖<br>Javy IA</a>
    </nav>

    <script>
        async function enviarMensagem() {
            const input = document.getElementById('userInput');
            const mensagem = input.value.trim();
            const chatMessages = document.getElementById('chatMessages');

            if (!mensagem) return;

            // Adiciona mensagem do usuário na tela
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user';
            userMsgDiv.textContent = mensagem;
            chatMessages.appendChild(userMsgDiv);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Mensagem temporária de "pensando"
            const botLoadingDiv = document.createElement('div');
            botLoadingDiv.className = 'message bot';
            botLoadingDiv.textContent = 'Pensando...';
            chatMessages.appendChild(botLoadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: mensagem })
                });

                const data = await response.json();
                botLoadingDiv.textContent = data.resposta || 'Erro ao processar resposta.';
            } catch (error) {
                botLoadingDiv.textContent = 'Erro de conexão com o servidor.';
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                enviarMensagem();
            }
        });
    </script>
</body>
</html>
