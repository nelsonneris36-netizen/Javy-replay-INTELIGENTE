<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Javy Replay</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

:root {
    --bg: #0d0d0f;
    --card: #19191c;
    --card2: #222225;
    --border: #303035;
    --yellow: #fbbf24;
    --text: #f5f5f5;
    --muted: #8b8b91;
}

body {
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(251,191,36,.08),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);
    padding-bottom: 95px;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 18px 18px 30px;
}

/* CABEÇALHO */
.header {
    text-align: center;
    padding: 18px 0 24px;
}

.logo {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -2px;
}

.logo span {
    color: var(--yellow);
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-top: 7px;
}

.counter {
    display: inline-block;
    margin-top: 17px;
    padding: 9px 16px;
    border-radius: 30px;
    background: rgba(251,191,36,.08);
    border: 1px solid rgba(251,191,36,.55);
    color: var(--yellow);
    font-size: 13px;
}

/* TELAS */
.screen {
    display: none;
}

.screen.active {
    display: block;
}

/* CARD */
.card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.01)
        ),
        var(--card);

    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.3);
}

/* TÍTULOS */
label {
    display: block;
    color: #e8e8e8;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: bold;
}

.section-title {
    color: #e8e8e8;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* TEXTAREA */
textarea {
    width: 100%;
    height: 155px;
    resize: none;
    outline: none;
    border: 1px solid #36363b;
    border-radius: 18px;
    background: var(--card2);
    color: white;
    padding: 16px;
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 25px;
    transition: .2s;
}

textarea::placeholder { color: #68686e; }
textarea:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(251,191,36,.07); }

/* EMOJIS */
.emojis {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
    margin-bottom: 25px;
}

.emoji {
    min-height: 70px;
    border: 1px solid #343439;
    border-radius: 15px;
    background: var(--card2);
    color: white;
    cursor: pointer;
    font-size: 27px;
    opacity: .55;
    transition: .18s;
}

.emoji.selected {
    opacity: 1;
    border-color: var(--yellow);
    background: rgba(251,191,36,.08);
    box-shadow: 0 0 18px rgba(251,191,36,.08);
    transform: translateY(-2px);
}

/* CATEGORIAS */
.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 25px;
}

.category {
    background: var(--card2);
    border: 1px solid #35353a;
    color: #ddd;
    padding: 10px 14px;
    border-radius: 22px;
    cursor: pointer;
    transition: .18s;
}

.category.selected {
    border-color: var(--yellow);
    color: var(--yellow);
    background: rgba(251,191,36,.07);
}

/* BOTÕES DE AÇÃO */
.save, .chat-send-btn {
    width: 100%;
    height: 57px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #ffd04a, #f5ae16);
    color: #111;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(251,191,36,.15);
    transition: .15s;
}

.save:active, .chat-send-btn:active { transform: scale(.98); }

/* PESQUISA */
.search {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    border-radius: 16px;
    border: 1px solid #343438;
    outline: none;
    background: var(--card2);
    color: white;
    margin-bottom: 15px;
}
.search:focus { border-color: var(--yellow); }
.search::placeholder { color: #707076; }

/* MEMÓRIAS */
.memory {
    background: linear-gradient(145deg, #202023, #18181a);
    border: 1px solid #303035;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 11px;
}

.memory-top { display: flex; justify-content: space-between; margin-bottom: 10px; }
.memory-category { color: var(--yellow); font-size: 13px; }
.memory-date { color: #77777d; font-size: 11px; }
.memory-text { color: #d0d0d4; line-height: 1.55; font-size: 15px; }

.delete {
    margin-top: 12px;
    background: transparent;
    color: #777;
    border: 1px solid #38383d;
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 12px;
}

/* TELA DO CHAT COM A IA */
.chat-messages {
    height: 320px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 0;
    margin-bottom: 15px;
}

.chat-msg {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 85%;
    font-size: 14px;
    line-height: 1.4;
}

.chat-msg.user {
    background: var(--yellow);
    color: #111;
    align-self: flex-end;
    font-weight: bold;
}

.chat-msg.javy {
    background: var(--card2);
    border: 1px solid var(--border);
    color: #f5f5f5;
    align-self: flex-start;
}

.chat-input-area {
    display: flex;
    gap: 8px;
}

.chat-input {
    flex: 1;
    height: 50px;
    padding: 0 16px;
    border-radius: 16px;
    border: 1px solid #343438;
    outline: none;
    background: var(--card2);
    color: white;
}
.chat-input:focus { border-color: var(--yellow); }

/* VAZIO */
.empty { text-align: center; color: #777; margin-top: 40px; }

/* TOAST */
.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1d1d20;
    border: 1px solid var(--yellow);
    color: var(--yellow);
    padding: 13px 20px;
    border-radius: 13px;
    display: none;
    z-index: 9999;
    box-shadow: 0 10px 35px rgba(0,0,0,.4);
}
.toast.show { display: block; }

/* NAVEGAÇÃO */
.nav {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 24px);
    max-width: 500px;
    height: 70px;
    background: rgba(27,27,30,.96);
    border: 1px solid #303035;
    border-radius: 23px;
    display: flex;
    padding: 5px;
    z-index: 100;
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}

.nav button {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 18px;
    color: #777;
    font-size: 13px;
    cursor: pointer;
    transition: .2s;
}

.nav button.active {
    color: var(--yellow);
    background: rgba(251,191,36,.08);
}
</style>
</head>

<body>

<div class="toast" id="toast">
    ✨ Memória guardada!
</div>

<div class="container">

    <div class="header">
        <div class="logo">Javy <span>Replay</span></div>
        <div class="subtitle">Suas histórias. Suas lembranças com IA.</div>
        <div class="counter" id="counter">0 Lembranças Guardadas</div>
    </div>

    <!-- TELA: NOVA MEMÓRIA -->
    <section id="newScreen" class="screen active">
        <div class="card">
            <label>✦ SUA HISTÓRIA</label>
            <textarea id="memoryText" placeholder="O que aconteceu hoje?"></textarea>

            <label>✦ COMO VOCÊ SE SENTIU?</label>
            <div class="emojis">
                <button type="button" class="emoji selected" data-emoji="😊">😊</button>
                <button type="button" class="emoji" data-emoji="🚀">🚀</button>
                <button type="button" class="emoji" data-emoji="❤️">❤️</button>
                <button type="button" class="emoji" data-emoji="😴">😴</button>
                <button type="button" class="emoji" data-emoji="😔">😔</button>
            </div>

            <label>✦ CATEGORIA</label>
            <div class="categories">
                <button type="button" class="category selected" data-category="Família">👨‍👩‍👧‍👦 Família</button>
                <button type="button" class="category" data-category="Viagem">✈️ Viagem</button>
                <button type="button" class="category" data-category="Trabalho">💼 Trabalho</button>
                <button type="button" class="category" data-category="Conquista">🏆 Conquista</button>
            </div>

            <button type="button" class="save" id="saveButton">✦ Guardar Memória</button>
        </div>
    </section>

    <!-- TELA: HISTÓRICO -->
    <section id="historyScreen" class="screen">
        <div class="card">
            <label>🔍 SUAS LEMBRANÇAS</label>
            <input class="search" id="searchInput" type="text" placeholder="Pesquisar lembranças...">
            <div id="memoryList">
                <div class="empty">Nenhuma lembrança guardada ainda.</div>
            </div>
        </div>
    </section>

    <!-- TELA: CHAT COM O JAVY (IA) -->
    <section id="chatScreen" class="screen">
        <div class="card">
            <label>🤖 CONVERSAR COM O JAVY</label>
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg javy">Salve meu chefe! Javy na área. Me pergunte sobre alguma lembrança que você guardou!</div>
            </div>
            <div class="chat-input-area">
                <input class="chat-input" id="userInput" type="text" placeholder="Javy, lembra de..." onkeypress="handleKeyPress(event)">
                <button class="chat-send-btn" style="width: 70px; height: 50px;" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </section>

</div>

<!-- NAVEGAÇÃO -->
<nav class="nav">
    <button type="button" id="newButton" class="active">📝<br>Nova</button>
    <button type="button" id="historyButton">🔍<br>Histórico</button>
    <button type="button" id="chatButton">🤖<br>Javy IA</button>
</nav>

<script>
     = ";

    let memories = [];
    let selectedEmoji = "😊";
    let selectedCategory = "Família";

    const newScreen = document.getElementById("newScreen");
    const historyScreen = document.getElementById("historyScreen");
    const chatScreen = document.getElementById("chatScreen");

    const newButton = document.getElementById("newButton");
    const historyButton = document.getElementById("historyButton");
    const chatButton = document.getElementById("chatButton");

    const saveButton = document.getElementById("saveButton");
    const memoryText = document.getElementById("memoryText");
    const searchInput = document.getElementById("searchInput");
    const memoryList = document.getElementById("memoryList");
    const counter = document.getElementById("counter");
    const toast = document.getElementById("toast");

    // TROCAR DE TELA
    function trocarTela(telaAtiva) {
        newScreen.classList.remove("active");
        historyScreen.classList.remove("active");
        chatScreen.classList.remove("active");
        
        newButton.classList.remove("active");
        historyButton.classList.remove("active");
        chatButton.classList.remove("active");

        if (telaAtiva === 'new') {
            newScreen.classList.add("active");
            newButton.classList.add("active");
        } else if (telaAtiva === 'history') {
            historyScreen.classList.add("active");
            historyButton.classList.add("active");
            renderMemories();
        } else if (telaAtiva === 'chat') {
            chatScreen.classList.add("active");
            chatButton.classList.add("active");
        }
    }

    newButton.addEventListener("click", () => trocarTela('new'));
    historyButton.addEventListener("click", () => trocarTela('history'));
    chatButton.addEventListener("click", () => trocarTela('chat'));

    // EMOJIS
    document.querySelectorAll(".emoji").forEach(button => {
        button.addEventListener("click", () => {
            document.querySelectorAll(".emoji").forEach(item => item.classList.remove("selected"));
            button.classList.add("selected");
            selectedEmoji = button.dataset.emoji;
        });
    });

    // CATEGORIAS
    document.querySelectorAll(".category").forEach(button => {
        button.addEventListener("click", () => {
            document.querySelectorAll(".category").forEach(item => item.classList.remove("selected"));
            button.classList.add("selected");
            selectedCategory = button.dataset.category;
        });
    });

    // SALVAR MEMÓRIA
    saveButton.addEventListener("click", () => {
        const text = memoryText.value.trim();
        if (text === "") {
            alert("Escreva alguma coisa antes de guardar!");
            return;
        }

        const now = new Date();
        const date = now.toLocaleDateString("pt-BR");

        const memory = {
            id: Date.now(),
            text: text,
            emoji: selectedEmoji,
            category: selectedCategory,
            date: date
        };

        memories.unshift(memory);
        memoryText.value = "";
        updateCounter();
        showToast();
        trocarTela('history');
    });

    // PESQUISA DO HISTÓRICO
    searchInput.addEventListener("input", () => renderMemories());

    function renderMemories() {
        if (memories.length === 0) {
            memoryList.innerHTML = '<div class="empty">Nenhuma lembrança guardada ainda.</div>';
            return;
        }

        memoryList.innerHTML = "";
        memories.forEach(memory => {
            const item = document.createElement("div");
            item.className = "memory";

            item.innerHTML = `
                <div class="memory-top">
                    <span class="memory-category">${memory.emoji}${memory.category}</span>
                    <span class="memory-date">${memory.date}</span>
                </div>
                <div class="memory-text">${memory.text}</div>
                <button class="delete" onclick="apagarMemoria(${memory.id})">Apagar</button>
            `;
            memoryList.appendChild(item);
        });
    }

    function apagarMemoria(id) {
        memories = memories.filter(item => item.id !== id);
        updateCounter();
        renderMemories();
    }

    function updateCounter() {
        const total = memories.length;
        counter.textContent = total + (total === 1 ? " Lembrança Guardada" : " Lembranças Guardadas");
    }

    function showToast() {
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2000);
    }

    // INTEGRAÇÃO COM A IA (JAVY IA)
    async function enviarMensagem() {
        const input = document.getElementById("userInput");
        const chatMessages = document.getElementById("chatMessages");
        const pergunta = input.value.trim();
        
        if (pergunta === "") return;

        // Adiciona mensagem do usuário no chat
        chatMessages.innerHTML += `<div class="chat-msg user">${pergunta}</div>`;
        input.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Mensagem temporária de "pensando"
        const javyMsgDiv = document.createElement("div");
        javyMsgDiv.className = "chat-msg javy";
        javyMsgDiv.textContent = "Pensando nas memórias...";
        chatMessages.appendChild(javyMsgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        // Junta todas as memórias cadastradas para o contexto da IA
        const contextoMemoria = memories.map(m => `[${m.category}] ${m.text} (${m.date})`).join(" | ");

        let promptInstrucao = "";
        if (contextoMemoria) {
            promptInstrucao = `Você é o Javy, um assistente de memórias amigável, nostálgico e informal do app Javy Replay. Use estritamente as memórias salvas pelo usuário para responder: "${contextoMemoria}". Responda à pergunta do usuário ("${pergunta}") confirmando animadamente que lembra ("Lembro sim!") e contando os detalhes de forma natural e amigável. Se a resposta não estiver nas memórias, diga com descontração que não se lembra disso.`;
        } else {
            promptInstrucao = `Você é o Javy, um assistente de memórias amigável e informal do app Javy Replay. O usuário perguntou "${pergunta}", mas o banco de memórias dele está vazio. Responda de forma leve e descontraída dizendo que ele ainda não salvou nenhuma lembrança.`;
        }

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptInstrucao }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                javyMsgDiv.textContent = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                javyMsgDiv.textContent = `Erro da API: ${data.error.message}`;
            } else {
                javyMsgDiv.textContent = "Poxa, a IA respondeu num formato inesperado.";
            }

        } catch (error) {
            javyMsgDiv.textContent = "Erro de conexão com o servidor do Javy.";
            console.error("Erro de rede:", error);
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            enviarMensagem();
        }
    }
</script>

</body>
</html>
